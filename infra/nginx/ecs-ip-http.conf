# Host Nginx: ACME HTTP-01 validation only. Existing public :8080 is untouched.
server {
    listen 80 default_server;
    server_name 47.114.51.41;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/zbt-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
