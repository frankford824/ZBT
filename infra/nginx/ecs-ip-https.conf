# Independent host TLS edge; never changes registration or the HTTP :8080 entry.
# IMPORTANT: MinIO's current public signing authority is 47.114.51.41:8080.
# JSON URLs are presented over TLS, but the object proxy restores that exact
# signed Host. Query strings and object paths must remain unchanged.
limit_req_zone $binary_remote_addr zone=zbt_tls_login:10m rate=5r/m;

server {
    listen 443 ssl;
    server_name 47.114.51.41;
    ssl_certificate /etc/letsencrypt/live/47.114.51.41/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.114.51.41/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ZBT_TLS:10m;
    ssl_session_timeout 1d;
    # No HSTS: it would interfere with the intentionally retained HTTP entry.
    client_max_body_size 20m;

    location = /api/v1/auth/login {
        limit_req zone=zbt_tls_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 300s;
        # The HTTP API contract remains unchanged on :8080. On TLS, only the
        # public object origin changes; SigV4 receives its original Host below.
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'http://47.114.51.41:8080/' 'https://47.114.51.41/';
    }

    location ~ ^/zbt-files(?:/|$) {
        proxy_pass http://127.0.0.1:19000;
        proxy_set_header Host 47.114.51.41:8080;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
