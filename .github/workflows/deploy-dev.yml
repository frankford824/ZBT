name: Deploy development to ECS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zbt-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, deploy, and verify ZBT
    runs-on: [self-hosted, linux, x64, zbt-dev]
    environment: development
    timeout-minutes: 60

    steps:
      - name: Check out the release commit
        id: checkout
        timeout-minutes: 3
        continue-on-error: true
        uses: actions/checkout@v7

      # Some ECS networks can reach GitHub's API/codeload but not github.com.
      # Fetch the exact release SHA from GitHub itself, never a third-party mirror.
      - name: Fetch release archive if Git transport is unavailable
        if: steps.checkout.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --retry 3 \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" \
            --output "$release_dir/release.tar.gz"
          mkdir "$release_dir/source"
          tar -xzf "$release_dir/release.tar.gz" --strip-components=1 -C "$release_dir/source"
          test -f "$release_dir/source/docker-compose.ecs.yml"
          rsync -a --delete --exclude '.git/' --exclude '.env' "$release_dir/source/" "$GITHUB_WORKSPACE/"

      - name: Prepare deployment directory and environment
        env:
          POSTGRES_SUPER_PASSWORD: ${{ secrets.POSTGRES_SUPER_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_SERVICE_HMAC_SECRET: ${{ secrets.AI_SERVICE_HMAC_SECRET }}
          COLLECTOR_HMAC_SECRET: ${{ secrets.COLLECTOR_HMAC_SECRET }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          AI_MODEL_PRICING_JSON: ${{ secrets.AI_MODEL_PRICING_JSON }}
          OCR_API_KEY: ${{ secrets.OCR_API_KEY }}
          DEFAULT_TENANT_ID: ${{ vars.DEFAULT_TENANT_ID }}
          MINIO_PUBLIC_ENDPOINT: ${{ vars.MINIO_PUBLIC_ENDPOINT }}
        run: |
          release_path="/opt/zbt/releases/${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0750 "$release_path"
          rsync -a --exclude '.git/' --exclude '.env' ./ "$release_path/"
          printf 'ZBT_RELEASE_PATH=%s\n' "$release_path" >> "$GITHUB_ENV"
          umask 077
          {
            printf 'APP_ENV=development\n'
            printf 'ZBT_RELEASE_TAG=%s-%s-%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'POSTGRES_SUPER_PASSWORD=%s\n' "$POSTGRES_SUPER_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_ACCESS_TTL=8h\n'
            printf 'AI_SERVICE_HMAC_SECRET=%s\n' "$AI_SERVICE_HMAC_SECRET"
            printf 'COLLECTOR_HMAC_SECRET=%s\n' "$COLLECTOR_HMAC_SECRET"
            printf 'PLATFORM_TENDER_POOL_PUBLIC=true\n'
            printf 'DEFAULT_TENANT_ID=%s\n' "$DEFAULT_TENANT_ID"
            printf 'MINIO_ENDPOINT=minio:9000\n'
            printf 'MINIO_PUBLIC_ENDPOINT=%s\n' "$MINIO_PUBLIC_ENDPOINT"
            printf 'MINIO_ACCESS_KEY=%s\n' "$MINIO_ACCESS_KEY"
            printf 'MINIO_SECRET_KEY=%s\n' "$MINIO_SECRET_KEY"
            printf 'MINIO_USE_SSL=false\n'
            printf 'MINIO_REGION=us-east-1\n'
            printf 'MINIO_BUCKET=zbt-files\n'
            printf 'MINIO_ENSURE_BUCKET=true\n'
            printf 'USE_MOCK_PROVIDERS=false\n'
            printf 'ALLOW_MOCK_FALLBACK=false\n'
            printf 'MODEL_ROUTING_FILE=./app/config/model_routing.yaml\n'
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'OPENAI_BASE_URL=%s\n' "$OPENAI_BASE_URL"
            printf 'AI_MODEL_PRICING_JSON=%s\n' "$AI_MODEL_PRICING_JSON"
            printf 'OCR_PROVIDER=http_ocr\n'
            printf 'OCR_API_KEY=%s\n' "$OCR_API_KEY"
            printf 'OCR_HTTP_ENDPOINT=http://ocr-service:8001/parse\n'
            printf 'ZIZHI_API_URL=\n'
            printf 'ZIZHI_API_KEY=\n'
          } > "$release_path/.env"

      - name: Build, back up, deploy and verify with automatic rollback
        run: python3 "$ZBT_RELEASE_PATH/infra/scripts/deploy_dev.py" --release-dir "$ZBT_RELEASE_PATH"

      - name: Update backup implementation after successful deployment
        run: |
          install -m 0644 "$ZBT_RELEASE_PATH/infra/scripts/backup_dev.py" /opt/zbt-maintenance/backup_dev.py

      - name: Show service diagnostics on failure
        if: failure()
        run: |
          docker ps --filter name=zbt-dev
          # Detailed bounded logs are kept privately in the pre-deploy backup.
          # Avoid publishing provider payloads/secrets into GitHub job logs.
