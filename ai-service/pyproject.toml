[project]
name = "zbt-ai-service"
version = "0.1.0"
description = "ZhiBiaoTong AI, RAG, document parsing, and export service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.124.0",
  "uvicorn[standard]>=0.38.0",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.3",
  "python-docx>=1.2.0",
  "docxtpl>=0.20.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "pymupdf>=1.26.0",
  "minio>=7.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.14.0",
  "mypy>=1.19.0",
]

[tool.pytest.ini_options]
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
