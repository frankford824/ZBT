providers:
  mock:
    type: mock
    fixtures_dir: ./tests/fixtures/ai
  openai_compatible_primary:
    type: openai_compatible
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
  dashscope:
    type: openai_compatible
    base_url_env: DASHSCOPE_BASE_URL
    api_key_env: DASHSCOPE_API_KEY
  anthropic:
    type: anthropic
    base_url_env: ANTHROPIC_BASE_URL
    api_key_env: ANTHROPIC_API_KEY
  deepseek:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY
  local_embedding:
    type: local
    endpoint_env: LOCAL_EMBEDDING_ENDPOINT

routes:
  tender_parse:
    primary:
      provider: mock
      model: configurable-high-quality-json-model
      temperature: 0.1
      output: json
      schema: TenderParseResult
    fallback:
      - provider: mock
        model: fallback-json-model
        timeout_s: 180
  outline_generate:
    primary:
      provider: mock
      model: configurable-json-model
      temperature: 0.2
      output: json
      schema: BidOutline
  knowledge_embedding:
    primary:
      provider: mock
      model: configurable-embedding-model
      dimensions: 1024
  knowledge_rerank:
    primary:
      provider: mock
      model: configurable-rerank-model
      top_k_input: 30
      top_k_output: 8
  chapter_generate:
    primary:
      provider: mock
      model: configurable-high-quality-generation-model
      temperature: 0.3
      stream: true
      require_source_refs: true
  chapter_self_check:
    primary:
      provider: mock
      model: configurable-low-cost-json-model
      temperature: 0.0
      output: json
      schema: ChapterSelfCheckResult
  compliance_check:
    primary:
      provider: mock
      model: configurable-high-quality-json-model
      temperature: 0.0
      output: json
      schema: ComplianceIssueList
  rewrite_assistant:
    primary:
      provider: mock
      model: configurable-fast-generation-model
      temperature: 0.4
      stream: true
  cost_advice:
    primary:
      provider: mock
      model: configurable-low-cost-json-model
      temperature: 0.2
      output: json
  document_ocr:
    primary:
      provider: mock
      model: configurable-ocr-model
  document_export:
    primary:
      provider: mock
      model: docx-export-engine

quotas:
  default_tenant_monthly_budget: 500
  currency: CNY
  on_exceed: downgrade_then_block
