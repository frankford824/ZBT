providers:
  local:
    type: local
  mock:
    type: mock
    fixtures_dir: ./tests/fixtures/ai
  openai_compatible_primary:
    type: openai_compatible
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    default_base_url: https://api.openai.com/v1
  cloudflare_ai_gateway:
    type: cloudflare_ai_gateway
  dashscope:
    type: openai_compatible
    base_url_env: DASHSCOPE_BASE_URL
    api_key_env: DASHSCOPE_API_KEY
  deepseek:
    type: openai_compatible
    base_url_env: DEEPSEEK_BASE_URL
    api_key_env: DEEPSEEK_API_KEY

routes:
  tender_parse:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.1
      output: json
      schema: TenderParseModuleResult
    fallback:
      - provider: mock
        model: fallback-json-model
        temperature: 0.1
        output: json
        schema: TenderParseModuleResult
        timeout_s: 180
  outline_generate:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.2
      output: json
      schema: BidOutline
    fallback:
      - provider: mock
        model: configurable-json-model
        temperature: 0.2
        output: json
        schema: BidOutline
  knowledge_embedding:
    primary:
      provider: openai_compatible_primary
      model: text-embedding-3-large
      dimensions: 1024
    fallback:
      - provider: mock
        model: configurable-embedding-model
        dimensions: 1024
  knowledge_process:
    primary:
      provider: local
      model: configurable-document-processing-pipeline
      output: json
      schema: KnowledgeProcessTask
      timeout_s: 300
  knowledge_rerank:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      top_k_input: 30
      top_k_output: 8
    fallback:
      - provider: mock
        model: configurable-rerank-model
        top_k_input: 30
        top_k_output: 8
  chapter_generate:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.3
      stream: true
      require_source_refs: true
    fallback:
      - provider: mock
        model: configurable-high-quality-generation-model
        temperature: 0.3
        stream: true
        require_source_refs: true
  chapter_self_check:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.0
      output: json
      schema: ChapterSelfCheckResult
    fallback:
      - provider: mock
        model: configurable-low-cost-json-model
        temperature: 0.0
        output: json
        schema: ChapterSelfCheckResult
  compliance_check:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.0
      output: json
      schema: ComplianceIssueList
    fallback:
      - provider: mock
        model: configurable-high-quality-json-model
        temperature: 0.0
        output: json
        schema: ComplianceIssueList
  rewrite_assistant:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.4
      stream: true
    fallback:
      - provider: mock
        model: configurable-fast-generation-model
        temperature: 0.4
        stream: true
  cost_advice:
    primary:
      provider: openai_compatible_primary
      model: gpt-4o-mini
      temperature: 0.2
      output: json
    fallback:
      - provider: mock
        model: configurable-low-cost-json-model
        temperature: 0.2
        output: json
  document_export:
    primary:
      provider: local
      model: docx-export-engine

quotas:
  default_tenant_monthly_budget: 500
  currency: CNY
  on_exceed: downgrade_then_block
