# Personal ECS development deployment overlay.
# Usage:
#   docker compose -p zbt-dev -f docker-compose.yml -f docker-compose.ecs.yml up -d --build
services:
  postgres:
    image: docker.m.daocloud.io/pgvector/pgvector:pg16
    container_name: zbt-dev-db
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
    ports: !override
      - "127.0.0.1:15432:5432"

  redis:
    image: docker.m.daocloud.io/library/redis:7
    container_name: zbt-dev-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports: !override
      - "127.0.0.1:16379:6379"

  minio:
    image: docker.m.daocloud.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: zbt-dev-minio
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports: !override
      - "0.0.0.0:19000:9000"
      - "127.0.0.1:19001:9001"

  backend:
    build:
      context: ./backend
      args:
        BASE_IMAGE_REGISTRY: docker.m.daocloud.io/library/
    container_name: zbt-dev-backend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_ENV: development
      MIGRATION_DATABASE_URL: postgres://zbt:${POSTGRES_SUPER_PASSWORD}@postgres:5432/zbt?sslmode=disable
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-00000000-0000-4000-8000-000000000001}
      ZIZHI_API_URL: ${ZIZHI_API_URL:-}
      ZIZHI_API_KEY: ${ZIZHI_API_KEY:-}
    ports: !override
      - "127.0.0.1:18080:8080"

  ai-service:
    build:
      context: ./ai-service
      args:
        BASE_IMAGE_REGISTRY: docker.m.daocloud.io/library/
        DEBIAN_MIRROR: https://mirrors.aliyun.com
        PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple/
    container_name: zbt-dev-ai
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      APP_ENV: development
      OCR_PROVIDER: http_ocr
      OCR_HTTP_ENDPOINT: http://ocr-service:8001/parse
      OCR_API_KEY: ${OCR_API_KEY}
    volumes:
      - ./ai-service/app/config/model_routing.btjs.yaml:/app/app/config/model_routing.yaml:ro
    ports: !override
      - "127.0.0.1:18000:8000"

  ocr-service:
    image: zbt-dev-ai-service:latest
    container_name: zbt-dev-ocr
    command: uvicorn app.ocr_bridge:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OCR_BRIDGE_API_KEY: ${OCR_API_KEY}
      OCR_BRIDGE_MODEL: qwen-vl-ocr
      OCR_BRIDGE_TIMEOUT_S: 120
      OCR_BRIDGE_MAX_BYTES: 20971520
      OCR_BRIDGE_MAX_PAGES: 20
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
    ports:
      - "127.0.0.1:18001:8001"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        BASE_IMAGE_REGISTRY: docker.m.daocloud.io/library/
    container_name: zbt-dev-frontend
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports: !override
      - "0.0.0.0:8080:80"
