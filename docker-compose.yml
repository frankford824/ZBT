services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zbt
      POSTGRES_USER: zbt
      POSTGRES_PASSWORD: zbt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zbt -d zbt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-zbt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-zbt_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://zbt_app:zbt_app@postgres:5432/zbt?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://zbt:zbt@postgres:5432/zbt?sslmode=disable
      REDIS_URL: redis:6379
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-8h}
      AI_SERVICE_URL: http://ai-service:8000
      AI_CALLBACK_URL: http://backend:8080/api/v1/ai/callbacks/tasks
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-zbt-ai-callback-secret}
      AI_MODEL_PRICING_JSON: ${AI_MODEL_PRICING_JSON:-{}}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-zbt_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-zbt_minio_secret}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-zbt-files}
      MINIO_ENSURE_BUCKET: ${MINIO_ENSURE_BUCKET:-true}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
    environment:
      USE_MOCK_PROVIDERS: ${USE_MOCK_PROVIDERS:-false}
      ALLOW_MOCK_FALLBACK: ${ALLOW_MOCK_FALLBACK:-true}
      MODEL_ROUTING_FILE: ./app/config/model_routing.yaml
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-openai_compatible_primary}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-openai_compatible_primary}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      AI_RERANK_PROVIDER: ${AI_RERANK_PROVIDER:-openai_compatible_primary}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_COMPATIBLE_MAX_RESPONSE_BYTES: ${OPENAI_COMPATIBLE_MAX_RESPONSE_BYTES:-8388608}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_ID: ${CLOUDFLARE_AI_GATEWAY_ID:-}
      CLOUDFLARE_AI_GATEWAY_OPENAI_BASE_URL: ${CLOUDFLARE_AI_GATEWAY_OPENAI_BASE_URL:-}
      CLOUDFLARE_AI_GATEWAY_TOKEN: ${CLOUDFLARE_AI_GATEWAY_TOKEN:-}
      CLOUDFLARE_AI_GATEWAY_HEADERS: ${CLOUDFLARE_AI_GATEWAY_HEADERS:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-http_ocr}
      OCR_API_KEY: ${OCR_API_KEY:-}
      OCR_HTTP_ENDPOINT: ${OCR_HTTP_ENDPOINT:-}
      OCR_HTTP_TIMEOUT_S: ${OCR_HTTP_TIMEOUT_S:-120}
      OCR_POLL_ENDPOINT: ${OCR_POLL_ENDPOINT:-}
      OCR_POLL_INTERVAL_S: ${OCR_POLL_INTERVAL_S:-2}
      OCR_POLL_MAX_ATTEMPTS: ${OCR_POLL_MAX_ATTEMPTS:-30}
      OCR_MAX_BYTES: ${OCR_MAX_BYTES:-20971520}
      OCR_MAX_RESPONSE_BYTES: ${OCR_MAX_RESPONSE_BYTES:-8388608}
      MINERU_HTTP_ENDPOINT: ${MINERU_HTTP_ENDPOINT:-}
      MINERU_API_KEY: ${MINERU_API_KEY:-}
      MINERU_PARSE_MODE: ${MINERU_PARSE_MODE:-auto}
      MINERU_HTTP_TIMEOUT_S: ${MINERU_HTTP_TIMEOUT_S:-120}
      MINERU_POLL_ENDPOINT: ${MINERU_POLL_ENDPOINT:-}
      MINERU_POLL_INTERVAL_S: ${MINERU_POLL_INTERVAL_S:-2}
      MINERU_POLL_MAX_ATTEMPTS: ${MINERU_POLL_MAX_ATTEMPTS:-30}
      PADDLEOCR_HTTP_ENDPOINT: ${PADDLEOCR_HTTP_ENDPOINT:-}
      PADDLEOCR_API_KEY: ${PADDLEOCR_API_KEY:-}
      PADDLEOCR_PIPELINE: ${PADDLEOCR_PIPELINE:-pp_structurev3}
      PADDLEOCR_HTTP_TIMEOUT_S: ${PADDLEOCR_HTTP_TIMEOUT_S:-120}
      PADDLEOCR_POLL_ENDPOINT: ${PADDLEOCR_POLL_ENDPOINT:-}
      PADDLEOCR_POLL_INTERVAL_S: ${PADDLEOCR_POLL_INTERVAL_S:-2}
      PADDLEOCR_POLL_MAX_ATTEMPTS: ${PADDLEOCR_POLL_MAX_ATTEMPTS:-30}
      LIBREOFFICE_PATH: /usr/bin/soffice
      BID_EXPORT_TEMPLATE_PATH: ${BID_EXPORT_TEMPLATE_PATH:-}
      BID_EXPORT_WATERMARK_TEXT: ${BID_EXPORT_WATERMARK_TEXT:-}
      AI_SERVICE_MAX_BODY_BYTES: ${AI_SERVICE_MAX_BODY_BYTES:-100663296}
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-zbt-ai-callback-secret}
      AI_CALLBACK_ALLOWED_HOSTS: ${AI_CALLBACK_ALLOWED_HOSTS:-backend,localhost,127.0.0.1,host.docker.internal}
      AI_CALLBACK_MAX_RESPONSE_BYTES: ${AI_CALLBACK_MAX_RESPONSE_BYTES:-65536}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-zbt_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-zbt_minio_secret}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_BUCKET: ${MINIO_BUCKET:-zbt-files}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
