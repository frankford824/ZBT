services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zbt
      POSTGRES_USER: zbt
      POSTGRES_PASSWORD: zbt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zbt -d zbt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: zbt_minio
      MINIO_ROOT_PASSWORD: zbt_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://zbt_app:zbt_app@postgres:5432/zbt?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://zbt:zbt@postgres:5432/zbt?sslmode=disable
      REDIS_URL: redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_BUCKET: zbt-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
    environment:
      USE_MOCK_PROVIDERS: "true"
      MODEL_ROUTING_FILE: ./app/config/model_routing.yaml
      LIBREOFFICE_PATH: /usr/bin/soffice
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
