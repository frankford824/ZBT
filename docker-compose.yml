services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: zbt
      POSTGRES_USER: zbt
      POSTGRES_PASSWORD: zbt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zbt -d zbt"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-zbt_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-zbt_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://zbt_app:zbt_app@postgres:5432/zbt?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://zbt:zbt@postgres:5432/zbt?sslmode=disable
      REDIS_URL: redis:6379
      AI_SERVICE_URL: http://ai-service:8000
      AI_CALLBACK_URL: http://backend:8080/api/v1/ai/callbacks/tasks
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-zbt-ai-callback-secret}
      AI_MODEL_PRICING_JSON: ${AI_MODEL_PRICING_JSON:-{}}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: 127.0.0.1:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-zbt_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-zbt_minio_secret}
      MINIO_REGION: us-east-1
      MINIO_BUCKET: zbt-files
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
    environment:
      USE_MOCK_PROVIDERS: ${USE_MOCK_PROVIDERS:-true}
      MODEL_ROUTING_FILE: ./app/config/model_routing.yaml
      AI_LLM_PROVIDER: ${AI_LLM_PROVIDER:-openai_compatible_primary}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-}
      AI_EMBEDDING_PROVIDER: ${AI_EMBEDDING_PROVIDER:-openai_compatible_primary}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      KNOWLEDGE_EMBEDDING_BATCH_SIZE: ${KNOWLEDGE_EMBEDDING_BATCH_SIZE:-32}
      AI_RERANK_PROVIDER: ${AI_RERANK_PROVIDER:-openai_compatible_primary}
      AI_RERANK_MODEL: ${AI_RERANK_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-}
      OCR_PROVIDER: ${OCR_PROVIDER:-http_ocr}
      OCR_HTTP_ENDPOINT: ${OCR_HTTP_ENDPOINT:-}
      OCR_HTTP_TIMEOUT_S: ${OCR_HTTP_TIMEOUT_S:-120}
      LIBREOFFICE_PATH: /usr/bin/soffice
      BID_EXPORT_TEMPLATE_PATH: ${BID_EXPORT_TEMPLATE_PATH:-}
      BID_EXPORT_WATERMARK_TEXT: ${BID_EXPORT_WATERMARK_TEXT:-}
      AI_SERVICE_HMAC_SECRET: ${AI_SERVICE_HMAC_SECRET:-dev-only-zbt-ai-callback-secret}
      AI_CALLBACK_ALLOWED_HOSTS: ${AI_CALLBACK_ALLOWED_HOSTS:-backend,localhost,127.0.0.1,host.docker.internal}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-zbt_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-zbt_minio_secret}
      MINIO_BUCKET: zbt-files
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
  minio_data:
